<div id="boot" role="status" aria-live="polite"><div class="boot-card"><i>R&amp;W</i>
<div class="boot-msg">Loading…</div><div class="boot-bar"><span></span></div>
<p class="boot-help">The first visit downloads the app (about 15 MB). After that it opens in a couple of seconds.</p></div></div>
<style>
#boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); color: var(--ink); padding: 24px; }
#boot .boot-card { width: min(420px, 100%); text-align: center; }
#boot i { display: inline-grid; place-items: center; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--II); color: #10142B;
  font: normal 800 1.05rem var(--sans); margin-bottom: 18px; }
#boot .boot-msg { font-weight: 800; font-size: 1.25rem; margin-bottom: 14px; }
#boot .boot-bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
#boot .boot-bar span { display: block; height: 100%; width: 40%; border-radius: 3px; background: var(--II); animation: bootslide 1.2s ease-in-out infinite; }
#boot .boot-help { color: var(--ink-2); font-size: .9rem; margin-top: 14px; }
#boot.failed .boot-bar { display: none; }
#boot.failed .boot-msg { color: var(--bad); }
@keyframes bootslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { #boot .boot-bar span { animation: none; width: 100%; } }
</style>
